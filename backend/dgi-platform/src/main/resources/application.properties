spring.application.name=dgi-platform
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://ep-still-flower-asagpvcy-pooler.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_8hjUaifJVk0Y
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Admin Account (bootstrapped by DataInitializer on first startup)
# Set these as OS / Docker / deployment environment variables — never hardcode here.
# ADMIN_PASSWORD has no default and MUST be set; if unset the admin account is not created.
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@dgi.gov.tn}
admin.password=${ADMIN_PASSWORD:000000}

# Spring Boot Actuator / Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
