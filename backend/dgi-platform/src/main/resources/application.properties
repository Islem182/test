# -------------------------------------------------------------------------
# Multipart file upload limits
# -------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# -------------------------------------------------------------------------
# OCR Engine (Tesseract via Tess4J)
# -------------------------------------------------------------------------
# tessdata path resolution order:
#   1. TESSDATA_PATH env var (set in OS / Docker / deployment)
#   2. TESSDATA_PREFIX env var (set automatically by the Tesseract Windows installer)
#   3. OcrServiceImpl auto-detects: C:\Program Files\Tesseract-OCR\tessdata
#      and common Linux/macOS paths as fallback — no manual config needed
#      on a standard Tesseract 5.x Windows install.
#
# Override only if your tessdata is in a non-standard location:
ocr.tessdata-path=${TESSDATA_PATH:}

# Language packs: French + Arabic + English (must be installed in tessdata/)
# Override via OCR_LANGUAGE env var if needed.
ocr.language=${OCR_LANGUAGE:fra+ara+eng}

# Maximum accepted upload size in bytes (default 10 MB)
ocr.max-file-size-bytes=10485760

# -------------------------------------------------------------------------
# Admin Account (bootstrapped by DataInitializer on first startup)
# Set these as OS / Docker / deployment environment variables — never hardcode here.
# ADMIN_PASSWORD has no default and MUST be set; if unset the admin account is not created.
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@dgi.gov.tn}
admin.password=${ADMIN_PASSWORD:000000}

# Spring Boot Actuator / Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
