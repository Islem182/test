version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dgi-postgres
    restart: always
    environment:
      POSTGRES_DB: dgi_db
      POSTGRES_USER: dgi_user
      POSTGRES_PASSWORD: dgi_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgi_user -d dgi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/dgi-platform
      dockerfile: Dockerfile
    container_name: dgi-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dgi_db
      SPRING_DATASOURCE_USERNAME: dgi_user
      SPRING_DATASOURCE_PASSWORD: dgi_secure_password_2026
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dgi-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
